<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticketing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #f0f1f6;
    --border: #e3e5ee;
    --text: #1b1d29;
    --muted: #6b6f82;
    --accent: #5b5bd6;
    --accent-hover: #4a4ac4;
    --accent-soft: #ececfb;
    --ok: #1f9d55;
    --ok-soft: #e3f6eb;
    --warn: #b7791f;
    --warn-soft: #fdf3e1;
    --err: #d64545;
    --err-soft: #fbe9e9;
    --shadow: 0 1px 2px rgba(20, 22, 40, .06), 0 4px 16px rgba(20, 22, 40, .06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12131a;
      --surface: #1b1c26;
      --surface-2: #242533;
      --border: #2e3042;
      --text: #ececf3;
      --muted: #9a9db2;
      --accent: #7b7bf0;
      --accent-hover: #8f8ff5;
      --accent-soft: #2a2a4a;
      --ok: #4ccb84;
      --ok-soft: #173326;
      --warn: #e6b062;
      --warn-soft: #3a2e18;
      --err: #f07171;
      --err-soft: #3d1f22;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .hidden { display: none !important; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 24px;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .user-chip { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: #fff; font-weight: 600; text-transform: uppercase;
  }
  .role-tag {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 32px 0 14px; }
  .section-head h2 { margin: 0; font-size: 20px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }

  /* Form controls */
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    font: inherit; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    font: inherit; font-weight: 600;
    padding: 10px 16px;
    border: 1px solid transparent; border-radius: 10px;
    cursor: pointer;
    transition: background .15s, transform .05s, opacity .15s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
  .btn-danger { background: var(--err-soft); color: var(--err); }
  .btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--err-soft) 70%, var(--err)); color: #fff; }
  .btn-small { padding: 6px 12px; font-size: 13px; }

  /* Auth */
  .auth-wrap { max-width: 420px; margin: 40px auto 0; }
  .auth-wrap h1 { text-align: center; margin: 0 0 6px; font-size: 26px; }
  .auth-wrap .sub { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .tabs { display: flex; background: var(--surface-2); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .tabs button { flex: 1; background: transparent; color: var(--muted); padding: 8px; }
  .tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .field { margin-bottom: 14px; }
  .auth-wrap .btn-primary { width: 100%; padding: 12px; margin-top: 4px; }

  /* Event cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .event { display: flex; flex-direction: column; gap: 12px; padding: 0; overflow: hidden; }
  .event-top { display: flex; gap: 14px; padding: 18px 18px 0; }
  .date-badge {
    flex: none; width: 56px; text-align: center;
    border-radius: 12px; background: var(--accent-soft); color: var(--accent);
    padding: 6px 0;
  }
  .date-badge .day { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .date-badge .mon { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .event h3 { margin: 0 0 2px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 13px; }
  .desc { color: var(--muted); font-size: 14px; margin: 0 18px; }
  .stock { margin: 0 18px; }
  .stock-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar > div { height: 100%; background: var(--ok); border-radius: 999px; transition: width .3s; }
  .bar.low > div { background: var(--warn); }
  .bar.out > div { background: var(--err); }
  .event-foot {
    margin-top: auto;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 14px 18px; border-top: 1px solid var(--border); background: var(--surface-2);
  }
  .price { font-size: 18px; font-weight: 700; margin-right: auto; }
  .book-row { display: flex; gap: 8px; width: 100%; }
  .book-row input { width: 64px; flex: none; padding: 7px 8px; }
  .book-row select { flex: 1; min-width: 0; padding: 7px 8px; }
  .book-row .btn-primary { flex: none; padding: 7px 16px; }

  .empty {
    text-align: center; color: var(--muted);
    padding: 40px 20px; border: 2px dashed var(--border); border-radius: var(--radius);
  }

  /* Create event */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .form-grid .wide { grid-column: 1 / -1; }
  .form-actions { display: flex; justify-content: flex-end; margin-top: 16px; }

  /* Customer area */
  .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }
  .two-col h3 { margin: 0 0 12px; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: 0; }
  .table-scroll { overflow-x: auto; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .pill.CONFIRMED { background: var(--ok-soft); color: var(--ok); }
  .pill.PENDING { background: var(--warn-soft); color: var(--warn); }
  .pill.FAILED { background: var(--err-soft); color: var(--err); }
  .pill.CANCELLED { background: var(--surface-2); color: var(--muted); }
  .notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .notes li { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
  .notes time { display: block; font-size: 12px; color: var(--muted); }

  /* Toast */
  #msg {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    max-width: min(560px, calc(100% - 32px));
    padding: 12px 18px; border-radius: 12px;
    background: var(--text); color: var(--bg);
    box-shadow: var(--shadow);
    font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 20;
  }
  #msg.show { opacity: 1; transform: translate(-50%, 0); }
  #msg.error { background: var(--err); color: #fff; }
  #msg.success { background: var(--ok); color: #fff; }

  @media (max-width: 600px) {
    .topbar { padding: 10px 16px; }
    .brand, .user-chip button { white-space: nowrap; }
    #meName { display: none; }
    main { padding: 20px 16px 80px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🎟️ Ticketing</div>
  <div id="me" class="user-chip hidden">
    <div class="avatar" id="meAvatar"></div>
    <div>
      <div id="meName" style="font-weight:600"></div>
    </div>
    <span class="role-tag" id="meRole"></span>
    <button class="btn-ghost btn-small" data-action="logout">Log out</button>
  </div>
</header>

<main>
  <section id="auth" class="auth-wrap">
    <h1>Welcome</h1>
    <p class="sub">Log in or create an account to book tickets.</p>
    <div class="card">
      <div class="tabs">
        <button type="button" data-mode="login" class="active">Log in</button>
        <button type="button" data-mode="register">Register</button>
      </div>
      <form id="authForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field hidden" id="roleField">
          <label for="role">I want to</label>
          <select id="role">
            <option value="customer">Book tickets (customer)</option>
            <option value="organizer">Host events (organizer)</option>
          </select>
        </div>
        <button class="btn-primary" type="submit" id="authSubmit">Log in</button>
      </form>
    </div>
  </section>

  <section id="organizer" class="hidden">
    <div class="section-head"><h2>Create an event</h2></div>
    <form class="card" id="eventForm">
      <div class="form-grid">
        <div class="wide">
          <label for="evTitle">Title</label>
          <input id="evTitle" placeholder="Summer Concert" required>
        </div>
        <div class="wide">
          <label for="evDesc">Description</label>
          <input id="evDesc" placeholder="What's happening?">
        </div>
        <div>
          <label for="evVenue">Venue</label>
          <input id="evVenue" placeholder="Hallenstadion, Zürich" required>
        </div>
        <div>
          <label for="evDate">Date &amp; time</label>
          <input id="evDate" type="datetime-local" required>
        </div>
        <div>
          <label for="evPrice">Price (CHF)</label>
          <input id="evPrice" type="number" min="0" step="0.05" placeholder="49.90" required>
        </div>
        <div>
          <label for="evCap">Tickets</label>
          <input id="evCap" type="number" min="1" step="1" placeholder="100" required>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" type="submit">Create event</button>
      </div>
    </form>
  </section>

  <section>
    <div class="section-head">
      <h2>Upcoming events</h2>
      <button class="btn-ghost btn-small" data-action="loadEvents">↻ Refresh</button>
    </div>
    <div id="events" class="grid"></div>
  </section>

  <section id="customer" class="hidden">
    <div class="section-head">
      <h2>My account</h2>
      <button class="btn-ghost btn-small" data-action="refreshAccount">↻ Refresh</button>
    </div>
    <div class="two-col">
      <div class="card">
        <h3>My bookings</h3>
        <div class="table-scroll">
          <table>
            <thead><tr><th>#</th><th>Event</th><th>Tickets</th><th>Total</th><th>Status</th><th></th></tr></thead>
            <tbody id="bookings"></tbody>
          </table>
        </div>
        <p id="noBookings" class="meta hidden">No bookings yet. Pick an event above.</p>
      </div>
      <div class="card">
        <h3>Notifications</h3>
        <ul id="notifications" class="notes"></ul>
        <p id="noNotifications" class="meta hidden">Nothing here yet.</p>
      </div>
    </div>
  </section>
</main>

<div id="msg" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('token');
let user = null;
let authMode = 'login';
let eventsById = {};
let toastTimer;

const money = (n) => `CHF ${Number(n).toFixed(2)}`;

// Small DOM helper: el('div', { class: 'x' }, child, 'text', ...)
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function show(text, type = '') {
  const box = $('msg');
  box.textContent = text;
  box.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (box.className = type), 3500);
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch('/api' + path, { method, headers, body: body && JSON.stringify(body) });
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw { status: res.status, data };
  return data;
}

const FRIENDLY = {
  401: 'Please log in again.',
  402: 'Payment failed. No tickets were booked.',
  403: "You're not allowed to do that.",
  409: 'Not enough tickets left.',
  503: 'A service is unavailable right now. Please try again.',
};

function fail(err) {
  if (!err.status) return show(String(err.message || err), 'error');
  const detail = err.data?.error;
  const text = err.status === 400 && detail ? detail : FRIENDLY[err.status] || detail || 'Something went wrong.';
  show(`${text} (${err.status})`, 'error');
}

// ---------- auth ----------

function setAuthMode(mode) {
  authMode = mode;
  for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('active', b.dataset.mode === mode);
  $('roleField').classList.toggle('hidden', mode !== 'register');
  $('authSubmit').textContent = mode === 'register' ? 'Create account' : 'Log in';
  $('password').autocomplete = mode === 'register' ? 'new-password' : 'current-password';
}

function creds() {
  return { username: $('username').value.trim(), password: $('password').value };
}

async function register() {
  try {
    await api('POST', '/users/register', { ...creds(), role: $('role').value });
    await login(true);
  } catch (e) { fail(e); }
}

async function login(afterRegister = false) {
  try {
    const { token: t } = await api('POST', '/users/login', creds());
    token = t;
    localStorage.setItem('token', t);
    await loadMe();
    $('password').value = '';
    show(afterRegister ? `Welcome, ${user.username}! Your account is ready.` : `Welcome back, ${user.username}!`, 'success');
  } catch (e) { fail(e); }
}

function logout() {
  token = null;
  user = null;
  localStorage.removeItem('token');
  render();
  show('Logged out.');
}

async function loadMe() {
  try {
    user = token ? await api('GET', '/users/me') : null;
  } catch {
    token = null;
    user = null;
    localStorage.removeItem('token');
  }
  render();
}

function render() {
  $('auth').classList.toggle('hidden', !!user);
  $('me').classList.toggle('hidden', !user);
  $('organizer').classList.toggle('hidden', user?.role !== 'organizer');
  $('customer').classList.toggle('hidden', user?.role !== 'customer');
  if (user) {
    $('meName').textContent = user.username;
    $('meAvatar').textContent = user.username.slice(0, 1);
    $('meRole').textContent = user.role;
  }
  loadEvents();
  if (user?.role === 'customer') refreshAccount();
}

// ---------- events ----------

function eventCard(ev) {
  const d = new Date(ev.date);
  const ratio = ev.capacity ? ev.available / ev.capacity : 0;
  const barClass = ev.available === 0 ? 'bar out' : ratio <= 0.2 ? 'bar low' : 'bar';
  const stockText = ev.available === 0 ? 'Sold out' : `${ev.available} of ${ev.capacity} left`;

  const foot = el('div', { class: 'event-foot' }, el('span', { class: 'price' }, money(ev.price)));

  if (user?.role === 'customer') {
    const qty = el('input', { type: 'number', min: '1', max: String(Math.min(10, Math.max(1, ev.available))), value: '1', 'aria-label': 'Tickets' });
    const pay = el('select', { 'aria-label': 'Payment' },
      el('option', { value: 'tok_ok' }, '💳 Card OK'),
      el('option', { value: 'tok_fail' }, '❌ Card declined'));
    const btn = el('button', { class: 'btn-primary', onclick: () => book(ev.id, Number(qty.value), pay.value, btn) },
      ev.available === 0 ? 'Sold out' : 'Book');
    if (ev.available === 0) btn.disabled = true;
    foot.append(el('div', { class: 'book-row' }, qty, pay, btn));
  } else if (user?.role === 'organizer' && ev.organizerId === user.id) {
    foot.append(el('button', { class: 'btn-danger btn-small', onclick: () => deleteEvent(ev.id) }, 'Delete'));
  } else if (!user) {
    foot.append(el('span', { class: 'meta' }, 'Log in to book'));
  }

  return el('article', { class: 'card event', 'data-event-id': ev.id },
    el('div', { class: 'event-top' },
      el('div', { class: 'date-badge' },
        el('div', { class: 'day' }, String(d.getDate())),
        el('div', { class: 'mon' }, d.toLocaleString('en', { month: 'short' }))),
      el('div', {},
        el('h3', {}, ev.title),
        el('div', { class: 'meta' }, `📍 ${ev.venue}`),
        el('div', { class: 'meta' }, `🕗 ${d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}`))),
    ev.description ? el('p', { class: 'desc' }, ev.description) : null,
    el('div', { class: 'stock' },
      el('div', { class: 'stock-row' }, el('span', { class: 'stock-text' }, stockText), el('span', {}, `${Math.round(ratio * 100)}%`)),
      el('div', { class: barClass }, el('div', { style: `width:${ratio * 100}%` }))),
    foot);
}

async function loadEvents() {
  try {
    const events = await api('GET', '/events');
    eventsById = Object.fromEntries(events.map((e) => [e.id, e]));
    const list = $('events');
    list.replaceChildren(...events.map(eventCard));
    if (!events.length) {
      list.append(el('div', { class: 'empty', style: 'grid-column:1/-1' },
        user?.role === 'organizer' ? 'No events yet. Create the first one above!' : 'No events yet. Check back soon.'));
    }
  } catch (e) { fail(e); }
}

async function createEvent() {
  try {
    const ev = await api('POST', '/events', {
      title: $('evTitle').value,
      description: $('evDesc').value,
      venue: $('evVenue').value,
      date: $('evDate').value ? new Date($('evDate').value).toISOString() : '',
      price: Number($('evPrice').value),
      capacity: Number($('evCap').value),
    });
    $('eventForm').reset();
    show(`Event "${ev.title}" created with ${ev.capacity} tickets.`, 'success');
    loadEvents();
  } catch (e) { fail(e); }
}

async function deleteEvent(id) {
  try {
    await api('DELETE', `/events/${id}`);
    show('Event deleted.', 'success');
    loadEvents();
  } catch (e) {
    if (e.status === 409) show("Can't delete an event that already has bookings. (409)", 'error');
    else fail(e);
  }
}

// ---------- bookings ----------

async function book(eventId, quantity, paymentToken, btn) {
  if (btn) btn.disabled = true;
  try {
    const b = await api('POST', '/bookings', { eventId, quantity, paymentToken });
    show(`Booked ${b.quantity} ticket${b.quantity > 1 ? 's' : ''} for ${money(b.totalPrice)} 🎉`, 'success');
  } catch (e) { fail(e); }
  if (btn) btn.disabled = false;
  loadEvents();
  loadBookings();
  setTimeout(loadNotifications, 300);
}

async function loadBookings() {
  try {
    const bookings = await api('GET', '/bookings');
    $('bookings').replaceChildren(...bookings.map((b) => el('tr', { 'data-booking-id': b.id },
      el('td', { class: 'meta' }, String(b.id)),
      el('td', {}, eventsById[b.eventId]?.title ?? `Event #${b.eventId}`),
      el('td', {}, String(b.quantity)),
      el('td', {}, b.totalPrice == null ? '–' : money(b.totalPrice)),
      el('td', {}, el('span', { class: `pill ${b.status}` }, b.status.toLowerCase())),
      el('td', {}, b.status === 'CONFIRMED'
        ? el('button', { class: 'btn-ghost btn-small', onclick: () => cancelBooking(b.id) }, 'Cancel')
        : null))));
    $('noBookings').classList.toggle('hidden', bookings.length > 0);
    $('bookings').closest('.table-scroll').classList.toggle('hidden', bookings.length === 0);
  } catch (e) { fail(e); }
}

async function cancelBooking(id) {
  try {
    await api('POST', `/bookings/${id}/cancel`);
    show('Booking cancelled. Your tickets were released.', 'success');
  } catch (e) { fail(e); }
  loadEvents();
  loadBookings();
}

async function loadNotifications() {
  try {
    const list = await api('GET', '/notifications');
    list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    $('notifications').replaceChildren(...list.map((n) => el('li', {},
      el('time', {}, new Date(n.createdAt).toLocaleString('en-GB')), n.message)));
    $('noNotifications').classList.toggle('hidden', list.length > 0);
  } catch (e) { fail(e); }
}

async function refreshAccount() {
  await loadEvents();
  loadBookings();
  loadNotifications();
}

// ---------- wiring ----------
// Listeners instead of inline onclick: inline handlers resolve names against
// `document` first, so onclick="createEvent()" would call document.createEvent().
const actions = { logout, loadEvents, refreshAccount };
for (const btn of document.querySelectorAll('[data-action]')) {
  btn.addEventListener('click', () => actions[btn.dataset.action]());
}
for (const tab of document.querySelectorAll('.tabs button')) {
  tab.addEventListener('click', () => setAuthMode(tab.dataset.mode));
}
$('authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  authMode === 'register' ? register() : login();
});
$('eventForm').addEventListener('submit', (e) => {
  e.preventDefault();
  createEvent();
});

loadMe();
</script>
</body>
