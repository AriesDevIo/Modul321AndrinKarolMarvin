worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream user_service {
        zone user_service 64k;
        server user-service-1:3000 resolve max_fails=1 fail_timeout=10s;
        server user-service-2:3000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    upstream event_service {
        zone event_service 64k;
        server event-service-1:3000 resolve max_fails=1 fail_timeout=10s;
        server event-service-2:3000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    upstream booking_service {
        zone booking_service 64k;
        server booking-service-1:3000 resolve max_fails=1 fail_timeout=10s;
        server booking-service-2:3000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    upstream payment_service {
        zone payment_service 64k;
        server payment-service-1:3000 resolve max_fails=1 fail_timeout=10s;
        server payment-service-2:3000 resolve max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/users {
            proxy_pass http://user_service/users;
            include /etc/nginx/proxy_params;
        }
        location ^~ /api/users/ {
            proxy_pass http://user_service/users/;
            include /etc/nginx/proxy_params;
        }

        location = /api/events {
            proxy_pass http://event_service/events;
            include /etc/nginx/proxy_params;
        }
        location ^~ /api/events/ {
            proxy_pass http://event_service/events/;
            include /etc/nginx/proxy_params;
        }

        location = /api/bookings {
            proxy_pass http://booking_service/bookings;
            include /etc/nginx/proxy_params;
        }
        location ^~ /api/bookings/ {
            proxy_pass http://booking_service/bookings/;
            include /etc/nginx/proxy_params;
        }

        location = /api/payments {
            proxy_pass http://payment_service/payments;
            include /etc/nginx/proxy_params;
        }
        location ^~ /api/payments/ {
            proxy_pass http://payment_service/payments/;
            include /etc/nginx/proxy_params;
        }

        location = /api/notifications {
            proxy_pass http://payment_service/notifications;
            include /etc/nginx/proxy_params;
        }
        location ^~ /api/notifications/ {
            proxy_pass http://payment_service/notifications/;
            include /etc/nginx/proxy_params;
        }

        location ^~ /api/ {
            return 404;
        }

        # Web frontend (optional, F11)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
